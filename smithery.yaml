startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - PELICAN_URL
      - PELICAN_TOKEN
    properties:
      PELICAN_URL:
        type: string
        title: Pelican Panel URL
        description: "Base URL of your Pelican panel (no trailing slash). Example: https://panel.example.com"
      PELICAN_TOKEN:
        type: string
        title: Application API Key
        description: "Pelican Application API key (admin). Usually starts with 'papp_'."
      PELICAN_CLIENT_TOKEN:
        type: string
        title: Client (Account) API Key
        description: "Pelican Account API key (client scope). Usually starts with 'pacc_'. Optional; enables the pelican_client_* tools."
      PELICAN_TIMEOUT:
        type: number
        title: Request Timeout (seconds)
        description: "HTTP request timeout in seconds."
        default: 30
      PELICAN_VERIFY_SSL:
        type: boolean
        title: Verify SSL
        description: "Whether to verify the panel's TLS certificate."
        default: true
      PELICAN_USER_AGENT:
        type: string
        title: User Agent
        description: "Custom User-Agent header sent with requests."
        default: "PelicanMCP/0.1"
  commandFunction: |
    (config) => ({
      command: "pelican-mcp",
      args: ["--transport", "stdio", "--no-banner"],
      env: {
        PELICAN_URL: config.PELICAN_URL,
        PELICAN_TOKEN: config.PELICAN_TOKEN,
        PELICAN_CLIENT_TOKEN: config.PELICAN_CLIENT_TOKEN ?? "",
        PELICAN_TIMEOUT: String(config.PELICAN_TIMEOUT ?? 30),
        PELICAN_VERIFY_SSL: String(config.PELICAN_VERIFY_SSL ?? true),
        PELICAN_USER_AGENT: config.PELICAN_USER_AGENT ?? "PelicanMCP/0.1"
      }
    })
