[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pelican-mcp"
description = "Model Context Protocol (MCP) server for the Pelican Panel Application & Client APIs, built with FastMCP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "PixlFlip Enterprises" }]
keywords = ["mcp", "model-context-protocol", "pelican", "pelican-panel", "fastmcp", "game-server", "panel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]
dynamic = ["version"]
dependencies = [
    "fastmcp>=2.14.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/catualus/PelicanMCP"
Repository = "https://github.com/catualus/PelicanMCP"
Issues = "https://github.com/catualus/PelicanMCP/issues"
"Pelican Panel" = "https://pelican.dev"

[project.scripts]
pelican-mcp = "pelican_mcp.server:main"

[tool.hatch.version]
path = "pelican_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pelican_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "pelican_mcp",
    "README.md",
    "LICENSE",
    "skill.md",
    "manifest.json",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
